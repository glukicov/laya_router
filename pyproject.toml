[project]
name = "laya-router"
version = "0.1.0"
description = "One triage job, two brains: a 421M local decision model (Laya) against an OpenAI LLM classifier"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gleb Lukicov" }]
requires-python = ">=3.12,<3.13"
keywords = ["laya", "routing", "classification", "inference", "calibration", "llm", "openai", "fastapi"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.117",
    "laya==0.3.4",
    "pydantic>=2.8",
    "typer>=0.21",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
eval = [
    "httpx>=0.28",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openai>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "ruff>=0.13",
    "ty>=0.0.1a20",
]

[project.urls]
Homepage = "https://github.com/glukicov/laya_router"
Repository = "https://github.com/glukicov/laya_router"
Documentation = "https://github.com/glukicov/laya_router/blob/main/docs/EVAL.md"

[project.scripts]
laya-router = "laya_router.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The figures and the write-up use real typography: x, - and the like are intentional in display strings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
# ty has no strict mode; fail on warnings too, not only errors.
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads and runs the real 421M Laya checkpoint"]
filterwarnings = [
    # starlette's TestClient still trips these on the pinned httpx/anyio combination.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
